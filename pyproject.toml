[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shakewm"
version = "0.1.0"
description = "Passive visual feature forecasting with causal historical IMU"
requires-python = ">=3.10"
dependencies = ["torch>=2.5", "numpy>=1.24"]

[project.optional-dependencies]
encoder = ["timm>=1.0,<2"]
test = ["pytest>=8"]

[project.scripts]
shakewm = "shakewm.cli:main"

[tool.setuptools]
packages = ["shakewm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
